services:
  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8077"
    volumes:
      - ./backend/data:/app/data   # handoffs.json — giữ hàng đợi SAP qua restart/rebuild

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8090:80"     # mở STT Studio ở http://<VM>:8090
    depends_on:
      - backend
